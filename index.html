<style>

/* ===== รูปโปรไฟล์ใหญ่พิเศษ ===== */


.photo-area{

    position:relative;

    width:350px;

    height:350px;

    margin:auto;

    display:flex;

    justify-content:center;

    align-items:center;


}



/* กรอบรูป */

.photo-frame{


    width:320px;

    height:320px;


    padding:15px;


    border-radius:50%;


    background:

    linear-gradient(
    135deg,
    #ffb6d5,
    #ffffff,
    #f48fb1,
    #ffd6e7
    );


    box-shadow:

    0 0 25px #f48fb1,

    0 0 60px rgba(244,143,177,.6);


    animation:

    float 3s ease-in-out infinite;


}



/* รูปด้านใน */


.photo-frame img{


    width:100%;

    height:100%;


    object-fit:cover;


    border-radius:50%;


    border:10px solid white;


    transition:.5s;


}



/* Hover รูปขยาย */

.photo-frame:hover img{


    transform:scale(1.08);


}





/* เอฟเฟกต์ลอย */


@keyframes float{


    0%,100%{

        transform:translateY(0);

    }


    50%{

        transform:translateY(-15px);

    }


}





/* แสงหมุนรอบกรอบ */


.photo-frame::before{


    content:"";


    position:absolute;


    width:340px;

    height:340px;


    border-radius:50%;


    border:3px dashed #fff;


    animation:

    spin 8s linear infinite;


}



@keyframes spin{


    from{

        transform:rotate(0deg);

    }


    to{

        transform:rotate(360deg);

    }

}







/* ของตกแต่งรอบรูป */


.sparkle{


    position:absolute;


    font-size:35px;


    animation:

    bounce 2s infinite;


}



.s1{

    top:10px;

    left:20px;

}



.s2{

    right:20px;

    top:60px;

}



.s3{

    bottom:30px;

    left:40px;

}




@keyframes bounce{


    0%,100%{

        transform:translateY(0);

    }


    50%{

        transform:translateY(-12px);

    }


}

/* ชื่อ */

.profile-card h2{

    margin-top:30px;

    font-size:28px;

    color:#c2185b;

}



/* ข้อความ */

.profile-card p{

    font-size:18px;

    margin-top:10px;

}

/* เมนู */

.menu{


    margin:60px auto;


    width:90%;


    display:grid;


    grid-template-columns:

    repeat(4,1fr);


    gap:30px;


}



.menu a{

    text-decoration:none;

    color:#633646;

}




.card{


    height:220px;


    background:white;


    border-radius:35px;


    display:flex;


    flex-direction:column;


    justify-content:center;


    align-items:center;


    box-shadow:


    0 15px 30px rgba(180,70,120,.2);


    transition:.4s;


}




.card:hover{


    transform:

    translateY(-15px);


    box-shadow:


    0 25px 50px rgba(180,70,120,.35);


}



.card span{

    font-size:55px;

}



.card h3{


    margin-top:15px;


    color:#c2185b;


    font-size:22px;


}



.card p{

    margin-top:8px;

}





footer{

    text-align:center;

    padding:25px;

    color:#8c5368;

}




@media(max-width:900px){


.menu{

grid-template-columns:repeat(2,1fr);

}


}



@media(max-width:500px){


.menu{

grid-template-columns:1fr;

}


.profile-card{

width:85%;

}


header h1{

font-size:38px;

}


}



</style>
