    text-decoration:none;

    color:#6d3b4c;

}



.box{

    background:white;

    width:220px;

    height:150px;

    border-radius:25px;

    padding:25px;


    box-shadow:

    transition:.3s;

}



.box:hover{

    transform:translateY(-10px);

    background:#fff0f5;

}



.box h2{

    font-size:40px;

}



.box h3{

    color:#c2185b;

    margin-top:10px;

}



/* Footer */

footer{

    margin-top:50px;

    padding:20px;

    background:rgba(255,255,255,.4);

}



/* มือถือ */

@media(max-width:600px){
