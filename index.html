<style>

@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Prompt',sans-serif;
}


body{

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #ffe4ef,
    #ffd1e3,
    #f8a8c4
    );

    color:#633646;

    overflow-x:hidden;

}



/* วงกลมตกแต่งพื้นหลัง */

.bg{

    position:absolute;

    border-radius:50%;

    filter:blur(5px);

    z-index:-1;

}


.bg1{

    width:300px;
    height:300px;

    background:#ffffff;

    top:-100px;
    left:-80px;

}


.bg2{

    width:250px;
    height:250px;

    background:#f48fb1;

    right:-70px;
    bottom:100px;

}




/* ส่วนหัว */

header{

    text-align:center;

    padding:50px 20px;

}



header h1{

    font-size:50px;

    color:#c2185b;

    letter-spacing:3px;

}


header p{

    font-size:22px;

    color:#7a4558;

}





/* กล่องข้อมูล */

.profile-card{


    width:380px;

    margin:auto;

    padding:35px;


    background:
    rgba(255,255,255,.65);


    backdrop-filter:blur(15px);


    border-radius:40px;


    text-align:center;


    box-shadow:

    0 20px 40px rgba(180,70,120,.25);


}




.profile-card img{


    width:180px;

    height:180px;

    object-fit:cover;


    border-radius:50%;


    border:10px solid #fff;


    box-shadow:

    0 0 0 8px #f8bbd0;


}



.profile-card h2{

    margin-top:25px;

    color:#c2185b;

}



.profile-card p{

    margin-top:8px;

}





/* เมนู */

.menu{


    margin:60px auto;


    width:90%;


    display:grid;


    grid-template-columns:

    repeat(4,1fr);


    gap:30px;


}



.menu a{

    text-decoration:none;

    color:#633646;

}




.card{


    height:220px;


    background:white;


    border-radius:35px;


    display:flex;


    flex-direction:column;


    justify-content:center;


    align-items:center;


    box-shadow:


    0 15px 30px rgba(180,70,120,.2);


    transition:.4s;


}




.card:hover{


    transform:

    translateY(-15px);


    box-shadow:


    0 25px 50px rgba(180,70,120,.35);


}



.card span{

    font-size:55px;

}



.card h3{


    margin-top:15px;


    color:#c2185b;


    font-size:22px;


}



.card p{

    margin-top:8px;

}





footer{

    text-align:center;

    padding:25px;

    color:#8c5368;

}




@media(max-width:900px){


.menu{

grid-template-columns:repeat(2,1fr);

}


}



@media(max-width:500px){


.menu{

grid-template-columns:1fr;

}


.profile-card{

width:85%;

}


header h1{

font-size:38px;

}


}


/* ===========================
   หิมะตก
=========================== */

.snow{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:-1;
}

.snow span{
    position:absolute;
    top:-10px;
    color:white;
    opacity:.9;
    animation:snow linear infinite;
}

@keyframes snow{

0%{
transform:translateY(-10px);
}

100%{
transform:translateY(110vh);
}

}

/* กล่องโปรไฟล์ลอย */

.profile-card{

animation:float 4s ease-in-out infinite;

}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0px);
}

}

/* หัวข้อเรืองแสง */

header h1{

text-shadow:
0 0 10px white,
0 0 25px #ff69b4;

}

/* พื้นหลังเคลื่อนไหว */

body{

background-size:200% 200%;

animation:bgMove 12s ease infinite;

}

@keyframes bgMove{

0%{
background-position:left top;
}

50%{
background-position:right bottom;
}

100%{
background-position:left top;
}

}

/* การ์ด */

.card{

background:rgba(255,255,255,.75);

backdrop-filter:blur(10px);

}

.card:hover{

transform:
translateY(-15px)
scale(1.03);

}

.card span{

transition:.3s;

}

.card:hover span{

transform:scale(1.25);

}
</style>


</head>
