<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | จันทกานต์ บางไธสง</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Prompt',sans-serif;
}

body{

    min-height:100vh;
    overflow-x:hidden;

    background:linear-gradient(
    -45deg,
    #ffe5f1,
    #ffd3e4,
    #f8aac7,
    #ffdce9);

    background-size:400% 400%;

    animation:bg 12s ease infinite;

}

@keyframes bg{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

/* หิมะ */

.snow{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

pointer-events:none;

z-index:-1;

overflow:hidden;

}

.snow span{

position:absolute;

top:-20px;

color:white;

animation:snow linear infinite;

}

@keyframes snow{

0%{

transform:translateY(-20px);

}

100%{

transform:translateY(110vh);

}

}

/* Header */

header{

text-align:center;

padding:50px 20px;

}

header h1{

font-size:60px;

color:#c2185b;

text-shadow:
0 0 15px white,
0 0 25px pink;

animation:glow 2s infinite alternate;

}

@keyframes glow{

from{

text-shadow:0 0 10px white;

}

to{

text-shadow:
0 0 25px hotpink;

}

}

header p{

font-size:22px;

color:#7b4155;

}

/* Profile */

.profile-card{

width:650px;

max-width:95%;

margin:auto;

padding:45px;

text-align:center;

background:rgba(255,255,255,.7);

backdrop-filter:blur(12px);

border-radius:35px;

box-shadow:
0 20px 40px rgba(0,0,0,.15);

animation:float 4s ease-in-out infinite;

}

@keyframes float{

0%{

transform:translateY(0);

}

50%{

transform:translateY(-10px);

}

100%{

transform:translateY(0);

}

}

.profile-card img{

width:360px;

height:360px;

object-fit:cover;

border-radius:50%;

border:10px solid white;

box-shadow:

0 0 0 10px #f8bbd0,

0 20px 40px rgba(255,105,180,.35);

}

.profile-card h2{

margin-top:25px;

color:#c2185b;

font-size:32px;

}

.profile-card p{

margin-top:10px;

font-size:20px;

color:#633646;

}
    /* เมนู */

.menu{

    width:90%;

    margin:60px auto;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:30px;

}

.menu a{

    text-decoration:none;

    color:#633646;

}

.card{

    background:rgba(255,255,255,.75);

    backdrop-filter:blur(10px);

    border-radius:30px;

    padding:40px;

    text-align:center;

    transition:.4s;

    box-shadow:

    0 15px 35px rgba(180,70,120,.25);

}

.card:hover{

    transform:

    translateY(-12px)

    scale(1.03);

    box-shadow:

    0 25px 45px rgba(180,70,120,.35);

}

.card span{

    font-size:60px;

    display:block;

    transition:.3s;

}

.card:hover span{

    transform:

    rotate(10deg)

    scale(1.2);

}

.card h3{

    margin-top:15px;

    color:#c2185b;

    font-size:24px;

}

.card p{

    margin-top:8px;

    color:#633646;

}

/* Footer */

footer{

    text-align:center;

    padding:30px;

    color:#8c5368;

}

/* Responsive */

@media(max-width:900px){

.menu{

grid-template-columns:repeat(2,1fr);

}

.profile-card{

width:90%;

}

.profile-card img{

width:280px;

height:280px;

}

}

@media(max-width:600px){

.menu{

grid-template-columns:1fr;

}

header h1{

font-size:42px;

}

.profile-card img{

width:220px;

height:220px;

}

}

</style>

</head>

<body>

<div class="snow" id="snow"></div>

<header>

<h1>🌸 PORTFOLIO</h1>

<p>จันทกานต์ บางไธสง</p>

</header>

<div class="profile-card">

<img src="images/IMG_7698.jpeg">

<h2>นางสาวจันทกานต์ บางไธสง</h2>

<p>นักเรียนชั้นมัธยมศึกษาปีที่ 6/1</p>

<p>โรงเรียนพานทอง</p>

</div>

<div class="menu">

<a href="profile.html">

<div class="card">

<span>👩🏻</span>

<h3>Profile</h3>

<p>ประวัติส่วนตัว</p>

</div>

</a>

<a href="education.html">

<div class="card">

<span>🎓</span>

<h3>Education</h3>

<p>ประวัติการศึกษา</p>

</div>

</a>
<a href="award.html">

<div class="card">

<span>🏆</span>

<h3>Award</h3>

<p>ผลงาน</p>

</div>

</a>

<a href="contact.html">

<div class="card">

<span>💌</span>

<h3>Contact</h3>

<p>ช่องทางติดต่อ</p>

</div>

</a>

</div>

<footer>

© 2026 Portfolio | จันทกานต์ บางไธสง

</footer>

<script>

// สร้างหิมะตก

const snow = document.getElementById("snow");

for(let i=0; i<150; i++){

    let flake = document.createElement("span");

    flake.innerHTML = "❄";

    flake.style.left = Math.random()*100 + "%";

    flake.style.fontSize = (8 + Math.random()*15) + "px";

    flake.style.opacity = Math.random();

    flake.style.animationDuration = (5 + Math.random()*8) + "s";

    flake.style.animationDelay = Math.random()*5 + "s";

    snow.appendChild(flake);

}

</script>

</body>

</html>
