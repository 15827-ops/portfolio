<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ประวัติส่วนตัว</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"TH Sarabun New",Tahoma,sans-serif;
}

body{

background:linear-gradient(135deg,#ffdbe8,#fff6fb,#ffeaf3);

min-height:100vh;

overflow-x:hidden;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}

/* กล่องหลัก */

.container{

width:900px;

text-align:center;

position:relative;

z-index:2;

}

/* หัวข้อ */

h1{

color:#ff4f96;

font-size:50px;

margin-bottom:20px;

animation:float 3s ease-in-out infinite;

}

/* รูป */

.photo-box{

width:250px;

height:300px;

margin:auto;

background:white;

padding:10px;

border-radius:25px;

border:5px solid #ffb6d9;

position:relative;

box-shadow:0 10px 20px rgba(255,105,180,.3);

animation:float 3s ease-in-out infinite;

}

.photo-box img{images/IMG_5994.jpeg

width:100%;

height:100%;

border-radius:18px;

object-fit:cover;

}

.cat{

position:absolute;

top:-15px;

left:-15px;

font-size:34px;

}

.flower{

position:absolute;

bottom:-15px;

right:-15px;

font-size:34px;

}

/* กล่องสองฝั่ง */

.content{

display:flex;

justify-content:center;

align-items:flex-start;

gap:35px;

margin-top:25px;

}

/* กล่องข้อมูล */

.card{

width:500px;

background:white;

padding:20px 25px;

border-radius:20px;

box-shadow:0 10px 20px rgba(255,105,180,.25);

animation:float 3.5s ease-in-out infinite;

}

.card h2{

color:#ff4f96;

margin-bottom:15px;

font-size:34px;

}

.card p{

font-size:25px;

line-height:1.9;

text-align:left;

color:#555;

}

/* ช่องทางการติดต่อ */

.contact{

width:250px;

animation:float 3.5s ease-in-out infinite;

}

.contact h2{

color:#ff4f96;

margin-bottom:15px;

white-space:nowrap;

}

.contact-grid{

display:flex;

flex-direction:column;

gap:12px;

}

.contact-grid a{

display:block;

background:#ffe6f2;

padding:14px;

border-radius:15px;

text-decoration:none;

text-align:center;

font-size:22px;

font-weight:bold;

color:#ff4f96;

transition:.3s;

}

.contact-grid a:hover{

background:#ffb6d9;

color:white;

transform:scale(1.05);

}

/* ปุ่ม */

.next{

margin-top:35px;

}

.next button{

width:250px;

padding:13px;

font-size:22px;

border:none;

border-radius:30px;

background:#ff70ad;

color:white;

cursor:pointer;

}

.next button:hover{

background:#ff4f96;

}

/* ลอย */

@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-8px);

}

}

/* ซากุระ */

.sakura{

position:fixed;

top:-30px;

font-size:22px;

pointer-events:none;

animation:fall linear infinite;

z-index:1;

}

@keyframes fall{

0%{

transform:translateY(-30px) rotate(0deg);

opacity:1;

}

100%{

transform:translateY(110vh) translateX(80px) rotate(360deg);

opacity:0;

}

}

</style>

</head>
<body>

<div class="container">

    <!-- หัวข้อ -->
    <h1>🌸 ประวัติส่วนตัว 🌸</h1>

    <!-- รูปโปรไฟล์ -->
    <div class="photo-box">

        <span class="cat">🐱</span>

        <!-- เปลี่ยนชื่อไฟล์เป็นรูปของคุณ -->
        <img src="profile.jpg" alt="Profile">

        <span class="flower">🌷</span>

    </div>

    <!-- ข้อมูล + ช่องทางการติดต่อ -->
    <div class="content">

        <!-- ข้อมูลส่วนตัว -->
        <div class="card">

            <h2>💗 ข้อมูลส่วนตัว</h2>

            <p>

                <b>ชื่อ :</b> นางสาว จันทกานต์ บางไธสง<br>

                <b>ชื่อเล่น :</b> เอย<br>

                <b>อายุ :</b> 17 ปี<br>

                <b>โรงเรียน :</b> โรงเรียนพานทอง<br>

                <b>ชั้น :</b> มัธยมศึกษาปีที่ 6/1<br>

                <b>งานอดิเรก :</b> ดูหนัง • ฟังเพลง • อ่านหนังสือ • ร้องเพลง

            </p>

        </div>

        <!-- ช่องทางการติดต่อ -->
        <div class="contact">

            <h2>📱 ช่องทางการติดต่อ</h2>

            <div class="contact-grid">

                <a href="https://instagram.com/your_username" target="_blank">
                    📷 Instagram
                </a>

                <a href="https://facebook.com/your_username" target="_blank">
                    📘 Facebook
                </a>

                <a href="https://www.tiktok.com/@your_username" target="_blank">
                    🎵 TikTok
                </a>

                <a href="https://line.me/ti/p/~your_lineid" target="_blank">
                    💚 LINE
                </a>

            </div>

        </div>

    </div>

    <!-- ปุ่มหน้าถัดไป -->
    <div class="next">

        <button onclick="location.href='page2.html'">
            หน้าถัดไป ➜
        </button>

    </div>

</div>
<script>

// 🌸 สร้างดอกซากุระร่วง
for(let i = 0; i < 50; i++){

    const sakura = document.createElement("div");

    sakura.className = "sakura";

    sakura.innerHTML = "🌸";

    sakura.style.left = Math.random() * 100 + "vw";

    sakura.style.fontSize = (16 + Math.random() * 18) + "px";

    sakura.style.animationDuration = (5 + Math.random() * 5) + "s";

    sakura.style.animationDelay = Math.random() * 5 + "s";

    document.body.appendChild(sakura);

}

</script>

</body>
</html>
