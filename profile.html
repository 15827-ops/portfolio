<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติส่วนตัว</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:linear-gradient(135deg,#ffdbe9,#fff3f8,#ffe8f2);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

/* จัดวาง */
.container{
display:flex;
align-items:center;
gap:35px;
z-index:2;
}

/* รูปวงกลม */
.photo img{
width:230px;
height:230px;
border-radius:50%;
border:6px solid #ff9fc9;
object-fit:cover;
box-shadow:0 5px 20px rgba(255,105,180,.35);
}

/* ด้านขวา */
.right{
display:flex;
flex-direction:column;
gap:15px;
}

/* กล่อง */
.card{
width:350px;
background:#fff;
padding:18px;
border-radius:18px;
box-shadow:0 5px 18px rgba(255,105,180,.25);
}

.card h2{
color:#ff4f96;
text-align:center;
margin-bottom:12px;
}

.card p{
font-size:18px;
line-height:1.8;
color:#444;
}

/* ลิงก์ */
a{
color:#ff4f96;
text-decoration:none;
font-weight:bold;
}

a:hover{
text-decoration:underline;
}

/* ปุ่ม */
button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:30px;
background:#ff70ad;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff4f96;
}

/* ซากุระ */
.sakura{
position:absolute;
top:-50px;
font-size:22px;
animation:fall linear infinite;
pointer-events:none;
}

@keyframes fall{
0%{
transform:translateY(-50px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) translateX(80px) rotate(360deg);
opacity:0;
}
}

</style>
</head>

<body>

<div class="container">

<div class="photo">
<img src="profile.jpg" alt="Profile">
</div>

<div class="right">

<div class="card">

<h2>🌸 ประวัติส่วนตัว 🌸</h2>

<p>
<b>ชื่อ :</b> นางสาว จันทกานต์ บางไธสง<br>
<b>ชื่อเล่น :</b> เอย<br>
<b>อายุ :</b> 17 ปี<br>
<b>โรงเรียน :</b> โรงเรียนพานทอง<br>
<b>ชั้น :</b> มัธยมศึกษาปีที่ 6/1
</p>

</div>

<div class="card">

<h2>📱 ช่องทางการติดต่อ</h2>

<p>
📷 Instagram :
<a href="https://instagram.com/your_username" target="_blank">@your_username</a>
<br><br>

📘 Facebook :
<a href="https://facebook.com/your_username" target="_blank">Facebook</a>
<br><br>

🎵 TikTok :
<a href="https://www.tiktok.com/@your_username" target="_blank">@your_username</a>
<br><br>

💚 LINE :
<a href="https://line.me/ti/p/~your_lineid" target="_blank">@your_lineid</a>

</p>

<button onclick="location.href='page2.html'">
หน้าถัดไป ➜
</button>

</div>

</div>

</div>

<script>

for(let i=0;i<45;i++){

let s=document.createElement("div");

s.className="sakura";

s.innerHTML="🌸";

s.style.left=Math.random()*100+"vw";

s.style.animationDuration=(5+Math.random()*5)+"s";

s.style.animationDelay=Math.random()*5+"s";

s.style.fontSize=(15+Math.random()*18)+"px";

document.body.appendChild(s);

}

</script>

</body>
</html>
