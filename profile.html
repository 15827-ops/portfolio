<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติส่วนตัว</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'TH Sarabun New',Tahoma,sans-serif;
}

body{
background:linear-gradient(135deg,#ffdce9,#fff6fb,#ffeef5);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* กล่องหลัก */

.container{
width:430px;
text-align:center;
z-index:2;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{
transform:translateY(0px);
}
50%{
transform:translateY(-8px);
}
}

h1{
color:#ff5c9f;
margin-bottom:15px;
font-size:42px;
}

/* รูป */

.photo-box{
width:230px;
height:230px;
margin:auto;
background:white;
padding:10px;
border-radius:25px;
border:5px solid #ffb6d9;
box-shadow:0 8px 20px rgba(255,105,180,.3);
position:relative;
animation:float 3s ease-in-out infinite;
}

.photo-box img{
width:100%;
height:100%;
border-radius:18px;
object-fit:cover;
}

/* แมวและดอกไม้ */

.cat{
position:absolute;
top:-18px;
left:-18px;
font-size:35px;
}

.flower{
position:absolute;
bottom:-18px;
right:-18px;
font-size:35px;
}

/* กล่อง */

.card{
margin-top:20px;
background:white;
padding:18px;
border-radius:20px;
box-shadow:0 8px 20px rgba(255,105,180,.25);
animation:float 3.5s ease-in-out infinite;
}

.card h2{
color:#ff5c9f;
margin-bottom:12px;
}

.card p{
font-size:24px;
line-height:1.8;
text-align:left;
}

/* ติดต่อ */

.contact-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:15px;
}

.contact-grid a{
display:block;
background:#ffe7f2;
padding:10px;
border-radius:12px;
text-decoration:none;
color:#ff4f96;
font-weight:bold;
transition:.3s;
}

.contact-grid a:hover{
background:#ffb6d9;
color:white;
}

/* ปุ่ม */

button{
margin-top:18px;
width:100%;
padding:12px;
border:none;
border-radius:30px;
background:#ff70ad;
color:white;
font-size:20px;
cursor:pointer;
}

button:hover{
background:#ff4f96;
}
