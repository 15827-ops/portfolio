<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติส่วนตัว</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Tahoma",sans-serif;
}

body{
    background:linear-gradient(135deg,#ffd6e7,#ffeef7,#fff8fc);
    overflow:hidden;
    height:100vh;
}

/* กล่องข้อมูล */

.container{
    width:400px;
    background:white;
    padding:30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(255,105,180,.3);
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* รูปโปรไฟล์ */

.profile{
    width:170px;
    height:170px;
    border-radius:50%;
    border:6px solid pink;
    object-fit:cover;
    box-shadow:0 0 20px rgba(255,105,180,.5);
}

h1{
    color:#ff5e9c;
    margin-top:15px;
}

p{
    margin-top:20px;
    color:#555;
    font-size:18px;
    line-height:35px;
}

button{
    margin-top:25px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:#ff7eb3;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#ff4f96;
    transform:scale(1.05);
}

/* ซากุระ */

.sakura{
    position:absolute;
    top:-50px;
    color:#ffb6c1;
    font-size:25px;
    animation:fall linear infinite;
}

@keyframes fall{
    0%{
        transform:translateY(-50px) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(110vh) translateX(80px) rotate(360deg);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="container">

<img src="profile.jpg" class="profile">

<h1>🌸 ประวัติส่วนตัว 🌸</h1>

<p>
<b>ชื่อ :</b> จันทกานต์ บางไธสง<br>
<b>ชื่อเล่น :</b> เอย
</p>

<button onclick="location.href='page2.html'">
หน้าถัดไป ➜
</button>

</div>

<script>

//สร้างดอกซากุระ

for(let i=0;i<40;i++){

let sakura=document.createElement("div");

sakura.className="sakura";

sakura.innerHTML="🌸";

sakura.style.left=Math.random()*100+"vw";

sakura.style.animationDuration=5+Math.random()*6+"s";

sakura.style.fontSize=15+Math.random()*20+"px";

sakura.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(sakura);

}

</script>

</body>
</html>
