<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ประวัติส่วนตัว</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"TH Sarabun New",Tahoma,sans-serif;
}

body{
    background:linear-gradient(135deg,#ffdbe8,#fff6fb,#ffeaf3);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    overflow-x:hidden;
}

/* กล่องหลัก */

.container{
    width:900px;
    text-align:center;
    position:relative;
    z-index:2;
}

/* หัวข้อ */

h1{
    color:#ff4f96;
    font-size:55px;
    margin-bottom:25px;
    animation:float 3s ease-in-out infinite;
}

/* รูปโปรไฟล์ */

.photo-box{
    width:260px;
    height:320px;
    margin:auto;
    background:#fff;
    padding:10px;
    border-radius:25px;
    border:5px solid #ffb6d9;
    box-shadow:0 10px 20px rgba(255,105,180,.3);
    position:relative;
    animation:float 3s ease-in-out infinite;
}

.photo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:18px;
}

.cat{
    position:absolute;
    top:-15px;
    left:-15px;
    font-size:35px;
}

.flower{
    position:absolute;
    bottom:-15px;
    right:-15px;
    font-size:35px;
}

/* กล่องประวัติ */

.card{
    width:650px;
    margin:35px auto 0;
    background:white;
    border-radius:25px;
    padding:30px 40px;
    box-shadow:0 10px 20px rgba(255,105,180,.25);
    animation:float 3.5s ease-in-out infinite;
}

.card h2{
    color:#ff4f96;
    font-size:38px;
    margin-bottom:20px;
}

.card p{
    font-size:29px;
    line-height:2;
    text-align:left;
    color:#555;
}

/* ปุ่ม */

.next{
    margin-top:35px;
}

.next button{
    width:250px;
    padding:14px;
    border:none;
    border-radius:30px;
    background:#ff70ad;
    color:white;
    font-size:24px;
    cursor:pointer;
    transition:.3s;
}

.next button:hover{
    background:#ff4f96;
    transform:scale(1.05);
}

/* เอฟเฟกต์ลอย */

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

/* ดอกซากุระ */

.sakura{
    position:fixed;
    top:-30px;
    font-size:22px;
    pointer-events:none;
    animation:fall linear infinite;
    z-index:1;
}

@keyframes fall{
    0%{
        transform:translateY(-30px) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(110vh) translateX(80px) rotate(360deg);
        opacity:0;
    }
}

</style>

</head>

<body>

<div class="container">

    <h1>🌸 ประวัติส่วนตัว 🌸</h1>

    <div class="photo-box">

        <span class="cat">🐱</span>

        <!-- เปลี่ยนเป็นชื่อรูปของคุณ -->
        <img src="images/IMG_5994.jpeg" alt="Profile">

        <span class="flower">🌷</span>

    </div>

    <div class="card">

        <h2>💗 ข้อมูลส่วนตัว</h2>

        <p>
            <b>ชื่อ :</b> นางสาว จันทกานต์ บางไธสง <br>

            <b>ชื่อเล่น :</b> เอย <br>

            <b>อายุ :</b> 17 ปี <br>

            <b>วันเกิด :</b> 24 มกราคม 2552 <br>

            <b>โรงเรียน :</b> โรงเรียนพานทอง <br>

            <b>ชั้น :</b> มัธยมศึกษาปีที่ 6/1 <br>

            <b>งานอดิเรก :</b> ดูหนัง • ฟังเพลง • อ่านหนังสือ • ร้องเพลง
        </p>

    </div>

    <div class="next">

        <button onclick="location.href='page2.html'">
            หน้าถัดไป ➜
        </button>

    </div>

</div>

<script>

// สร้างดอกซากุระ

for(let i=0;i<50;i++){

    let sakura=document.createElement("div");

    sakura.className="sakura";

    sakura.innerHTML="🌸";

    sakura.style.left=Math.random()*100+"vw";

    sakura.style.fontSize=(16+Math.random()*18)+"px";

    sakura.style.animationDuration=(5+Math.random()*5)+"s";

    sakura.style.animationDelay=Math.random()*5+"s";

    document.body.appendChild(sakura);

}

</script>

</body>
</html>
