<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ช่องทางการติดต่อ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"TH Sarabun New",Tahoma,sans-serif;
    background:linear-gradient(135deg,#ffe3ef,#fff7fb,#ffeef6);
    overflow-x:hidden;
    min-height:100vh;
}

/* หิมะตก */
.snow{
    position:fixed;
    top:-10px;
    color:white;
    user-select:none;
    animation:fall linear infinite;
    z-index:0;
    opacity:0.9;
}

@keyframes fall{
    to{
        transform:translateY(110vh);
    }
}

.container{
    width:90%;
    max-width:700px;
    margin:40px auto;
    text-align:center;
    position:relative;
    z-index:2;
}

h1{
    color:#ff5f9d;
    font-size:55px;
    margin-bottom:25px;
    text-shadow:2px 2px white;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

.photo{
    width:230px;
    height:230px;
    object-fit:cover;
    border-radius:25px;
    border:6px solid white;
    box-shadow:0 10px 25px rgba(255,105,180,.3);
    margin-bottom:25px;
    transition:.4s;
}

.photo:hover{
    transform:scale(1.05) rotate(2deg);
}

.card{
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(10px);
    border-radius:30px;
    padding:30px;
    box-shadow:0 10px 30px rgba(255,182,193,.4);
    animation:updown 3s ease-in-out infinite;
}

@keyframes updown{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

.contact-box{
    background:white;
    margin:20px 0;
    padding:18px;
    border-radius:20px;
    transition:.35s;
    box-shadow:0 5px 15px rgba(255,182,193,.35);
}

.contact-box:hover{
    transform:scale(1.03);
    background:#fff3f8;
}

.contact-box p{
    font-size:30px;
    color:#ff4f96;
    font-weight:bold;
}

.contact-box a{
    text-decoration:none;
    color:#666;
    font-size:28px;
}

.contact-box a:hover{
    color:#ff4f96;
}

.home-btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 38px;
    background:#ff8fbd;
    color:white;
    text-decoration:none;
    border-radius:50px;
    font-size:28px;
    transition:.3s;
    box-shadow:0 6px 18px rgba(255,105,180,.35);
}

.home-btn:hover{
    background:#ff5f9d;
    transform:translateY(-5px);
}

.footer{
    margin-top:20px;
    color:#ff7ea8;
    font-size:24px;
}
</style>

</head>
<body>

<div class="container">

<h1>💌 ช่องทางการติดต่อ 💌</h1>

<img src="images/IMG_8121.jpeg" class="photo" alt="รูปภาพ">

<div class="card">

<div class="contact-box">
<p>📷 Instagram</p>

<!-- ingoey_ -->
<a href="https://instagram.com/ingoey_" target="_blank">
@ingoey_
</a>

</div>

<div class="contact-box">

<p>📧 E-mail</p>

<!-- chanthakan240152 -->
<a href="mailto:chanthakan240152@gmail.com">
chanthakan240152@gmail.com
</a>

</div>

<a href="index.html" class="home-btn">
🏠 กลับหน้าหลัก
</a>

</div>

<div class="footer">
🌸 Thank you for visiting 🌸
</div>

</div>

<script>
function createSnow(){

const snow=document.createElement("div");

snow.classList.add("snow");

snow.innerHTML="❄";

snow.style.left=Math.random()*window.innerWidth+"px";

snow.style.fontSize=(10+Math.random()*20)+"px";

snow.style.animationDuration=(4+Math.random()*6)+"s";

snow.style.opacity=Math.random();

document.body.appendChild(snow);

setTimeout(()=>{
snow.remove();
},10000);

}

setInterval(createSnow,180);
</script>

</body>
</html>
