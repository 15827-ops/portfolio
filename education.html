<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติการศึกษา</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"TH Sarabun New",Tahoma,sans-serif;
}
body{
    background:linear-gradient(135deg,#ffd6e7,#fff3f8,#ffe9f3);
    min-height:100vh;
    padding:40px 20px;
    overflow-x:hidden;
    position:relative;
}
/* หิมะตก */
.snow{
    position:fixed;
    top:-20px;
    color:white;
    font-size:18px;
    animation:snowfall linear infinite;
    pointer-events:none;
    z-index:0;
}
@keyframes snowfall{
    0%{
        transform:translateY(-20px);
        opacity:1;
    }
    100%{
        transform:translateY(110vh) translateX(40px);
        opacity:0;
    }
}
/* กล่องหลัก */
.container{
    max-width:950px;
    margin:auto;
    position:relative;
    z-index:2;
}
/* หัวข้อ */
h1{
    text-align:center;
    color:#ff4f96;
    font-size:58px;
    margin-bottom:40px;
}
/* การ์ด */
.edu-card{
    display:flex;
    align-items:center;
    gap:30px;
    background:white;
    border:5px solid #ffb6d9;
    border-radius:30px;
    padding:25px;
    margin-bottom:35px;
    box-shadow:0 10px 20px rgba(255,105,180,.25);
    position:relative;
    transition:.3s;
}
.edu-card:hover{
    transform:translateY(-5px);
}
/* ตกแต่ง */
.edu-card::before{
    content:"🐰";
    position:absolute;
    top:10px;
    right:20px;
    font-size:42px;
}
.edu-card::after{
    content:"🌸🌷🌼";
    position:absolute;
    bottom:10px;
    right:20px;
    font-size:24px;
}
/* หมายเลข */
.number{
    position:absolute;
    top:-15px;
    left:-15px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#ff70ad;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    font-weight:bold;
}
/* วงกลมโลโก้ */
.logo{
    width:150px;
    height:150px;
    border-radius:50%;
    overflow:hidden;
    border:5px solid #ff9ec8;
    background:#fff0f6;
    flex-shrink:0;
}
.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}
/* ข้อมูล */
.info h2{
    color:#ff4f96;
    font-size:38px;
    margin-bottom:10px;
}
.info p{
    font-size:28px;
    color:#555;
    line-height:1.8;
}
/* ปุ่ม */
.next{
    display:flex;
    justify-content:center;
    margin-top:45px;
}
.next button{
    width:250px;
    padding:15px;
    border:none;
    border-radius:35px;
    background:#ff70ad;
    color:white;
    font-size:25px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 8px 18px rgba(255,105,180,.3);
}
.next button:hover{
    background:#ff4f96;
    transform:scale(1.05);
}
</style>
</head>
<body>
<div class="container">
<h1>🎓 ประวัติการศึกษา 🎓</h1>
<!-- ประถม -->
<div class="edu-card">
<div class="number">1</div>
<div class="logo">
<img src="images/primary.png" alt="โรงเรียนประถม">
</div>
<div class="info">
<h2>ระดับประถมศึกษา</h2>
<p>
โรงเรียนบัวใหญ่วิทยา<br>
สำเร็จการศึกษาระดับประถมศึกษา
</p>
</div>
</div>
<!-- ม.ต้น -->
<div class="edu-card">
<div class="number">2</div>
<div class="logo">
<img src="images/junior.png" alt="โรงเรียนมัธยมต้น">
</div>
<div class="info">
<h2>ระดับมัธยมศึกษาตอนต้น</h2>
<p>
โรงเรียนบัวใหญ่<br>
สำเร็จการศึกษาระดับมัธยมศึกษาตอนต้น
</p>
</div>
</div>
<!-- ม.ปลาย -->
<div class="edu-card">
<div class="number">3</div>
<div class="logo">
<img src="images/phanthong.png" alt="โรงเรียนพานทอง">
</div>
<div class="info">
<h2>ระดับมัธยมศึกษาตอนปลาย</h2>
<p>
โรงเรียนพานทอง<br>
กำลังศึกษาระดับชั้นมัธยมศึกษาปีที่ 6/1
</p>
</div>
</div>
<!-- ปุ่มหน้าถัดไป -->
<div class="next">
<button onclick="location.href='page3.html'">
🌸 หน้าถัดไป ➜
</button>
</div>
</div>
<script>
/* หิมะตก */
for(let i=0;i<90;i++){
const snow=document.createElement("div");
snow.className="snow";
snow.innerHTML="❄";
snow.style.left=Math.random()*100+"vw";
snow.style.fontSize=(10+Math.random()*18)+"px";
snow.style.animationDuration=(5+Math.random()*6)+"s";
snow.style.animationDelay=Math.random()*5+"s";
document.body.appendChild(snow);
}
</script>
</body>
</html>
